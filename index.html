
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SeeFile - Document Viewer</title>
  <meta
    name="description"
    content="Open and view documents directly in your browser with SeeFile."
  >

  <!-- Base and application styles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/viewer.css">

  <!-- Module styles -->
  <link rel="stylesheet" href="./css/modules/pdf.css">
  <link rel="stylesheet" href="./css/modules/code.css">
  <link rel="stylesheet" href="./css/modules/docx.css">
  <link rel="stylesheet" href="./css/modules/spreadsheet.css">
  <link rel="stylesheet" href="./css/modules/powerpoint.css">

  <!-- Vendor libraries -->
  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script src="./vendor/docx/docx-preview.min.js"></script>
  <script src="./vendor/xlsx/xlsx.full.min.js"></script>

  <!-- Main application -->
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <h1>SeeFile</h1>
      </div>

      <div class="header-actions">
        <button id="open-file" type="button">
          Open file
        </button>

        <input
          id="file-input"
          type="file"
          accept=".pdf,.docx,.xlsx,.xls,.csv,.pptx,.ppt,.txt,.html,.htm,.css,.js,.json,.xml,.py,.md"
          hidden
        >
      </div>
    </header>

    <!-- Document viewer -->
    <main id="stage" class="document-stage">
      <div class="viewer-empty-state">
        <p>Open a document to start viewing.</p>
      </div>
    </main>

    <!-- Status -->
    <footer class="app-footer">
      <span id="status" class="footer-status">Ready</span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span id="file-name" class="footer-file-name"></span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span id="position" class="footer-position">- / -</span>
    </footer>

  </div>
</body>
</html>
