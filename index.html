
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>SeeFile – Free Online Document Viewer | Private & Secure</title>

  <meta
    name="description"
    content="View PDF, Word, Excel, PowerPoint, CSV and text files online for free with SeeFile. A private, open-source document viewer that processes files locally in your browser. No uploads or account required."
  >

  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="author" content="SeeFile">
  <meta name="application-name" content="SeeFile">
  <meta name="theme-color" content="#ffffff">

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://md-shahid-ansari.github.io/see-file/"
  >

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="SeeFile – Free Online Document Viewer">
  <meta
    property="og:description"
    content="Open and view PDF, Word, Excel, PowerPoint and text documents directly in your browser. Free, open source and privacy-first. Your files stay on your device."
  >
  <meta
    property="og:url"
    content="https://md-shahid-ansari.github.io/see-file/"
  >
  <meta property="og:site_name" content="SeeFile">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SeeFile – Free Online Document Viewer">
  <meta
    name="twitter:description"
    content="View PDF, DOCX, Excel, PowerPoint and text files online for free. Private browser-based document viewing with no uploads or account required."
  >

  <!-- Base and application styles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/viewer.css">

  <!-- Module styles -->
  <link rel="stylesheet" href="./css/modules/pdf.css">
  <link rel="stylesheet" href="./css/modules/code.css">
  <link rel="stylesheet" href="./css/modules/docx.css">
  <link rel="stylesheet" href="./css/modules/spreadsheet.css">
  <link rel="stylesheet" href="./css/modules/powerpoint.css">

  <!-- Vendor libraries -->
  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script src="./vendor/docx/docx-preview.min.js"></script>
  <script src="./vendor/xlsx/xlsx.full.min.js"></script>

  <!-- Structured Data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "SeeFile",
    "url": "https://md-shahid-ansari.github.io/see-file/",
    "description": "A free, open-source, privacy-first online document viewer that lets users view PDF, Word, Excel, PowerPoint, CSV and text files directly in their browser without uploading documents to a SeeFile server.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires a modern web browser with JavaScript support.",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "license": "https://opensource.org/licenses/MIT",
    "featureList": [
      "Free online document viewer",
      "PDF document viewing",
      "Word DOCX document viewing",
      "Excel XLSX and XLS spreadsheet viewing",
      "CSV file viewing",
      "PowerPoint PPTX and PPT presentation viewing",
      "Code and text file viewing",
      "Local browser-based document processing",
      "No account required",
      "No document upload to a SeeFile server",
      "Read-only document viewing"
    ]
  }
  </script>

  <!-- Main application -->
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <h1>SeeFile</h1>
      </div>

      <div class="header-actions">
        <button id="open-file" type="button">
          Open file
        </button>

        <input
          id="file-input"
          type="file"
          accept=".pdf,.docx,.xlsx,.xls,.csv,.pptx,.ppt,.txt,.html,.htm,.css,.js,.json,.xml,.py,.md"
          hidden
        >
      </div>
    </header>

    <!-- Document viewer -->
    <main id="stage" class="document-stage">
      <div class="viewer-empty-state">
        <p>Open a document to start viewing.</p>
      </div>
    </main>

    <!-- Status -->
    <footer class="app-footer">
      <span id="status" class="footer-status">Ready</span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span id="file-name" class="footer-file-name"></span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span id="position" class="footer-position">- / -</span>
    </footer>

  </div>
</body>
</html>
