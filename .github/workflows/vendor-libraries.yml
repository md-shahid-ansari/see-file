name: Vendor browser libraries
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-libraries.yml"
      - "scripts/vendor-libraries.sh"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned browser libraries
        run: bash scripts/vendor-libraries.sh
      - name: Commit vendor files
        run: |
          if [[ -n "$(git status --porcelain vendor)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vendor
            git commit -m "Vendor pinned document rendering libraries"
            git push
          else
            echo "Vendor files are already current."
          fi
